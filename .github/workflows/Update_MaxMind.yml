name: Update MaxMind

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

concurrency:
  group: update-maxmind
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 1

      - name: Download MaxMind databases
        env:
          ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          LICENSE_KEY: ${{ secrets.MAXMIND_GEOLITE2_LICENSE }}
        run: |
          set -euo pipefail
          mkdir -p Maxmind
          BASE_URL="https://download.maxmind.com/geoip/databases"

          curl -fsSL --retry 3 --retry-delay 5 \
            -u "${ACCOUNT_ID}:${LICENSE_KEY}" \
            "${BASE_URL}/GeoLite2-ASN/download?suffix=tar.gz" \
            -o Maxmind/GeoLite2-ASN.tar.gz

          curl -fsSL --retry 3 --retry-delay 5 \
            -u "${ACCOUNT_ID}:${LICENSE_KEY}" \
            "${BASE_URL}/GeoLite2-ASN-CSV/download?suffix=zip" \
            -o Maxmind/GeoLite2-ASN-CSV.zip

          curl -fsSL --retry 3 --retry-delay 5 \
            -u "${ACCOUNT_ID}:${LICENSE_KEY}" \
            "${BASE_URL}/GeoLite2-Country/download?suffix=tar.gz" \
            -o Maxmind/GeoLite2-Country.tar.gz

          curl -fsSL --retry 3 --retry-delay 5 \
            -u "${ACCOUNT_ID}:${LICENSE_KEY}" \
            "${BASE_URL}/GeoLite2-Country-CSV/download?suffix=zip" \
            -o Maxmind/GeoLite2-Country-CSV.zip

      - name: Extract MMDB
        run: |
          set -euo pipefail
          rm -rf /tmp/maxmind
          mkdir -p /tmp/maxmind

          tar -xzf Maxmind/GeoLite2-ASN.tar.gz -C /tmp/maxmind
          cp "$(find /tmp/maxmind -name 'GeoLite2-ASN.mmdb' -print -quit)" Maxmind/ASN.mmdb

          rm -rf /tmp/maxmind/*
          tar -xzf Maxmind/GeoLite2-Country.tar.gz -C /tmp/maxmind
          cp "$(find /tmp/maxmind -name 'GeoLite2-Country.mmdb' -print -quit)" Maxmind/Country.mmdb

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Maxmind/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update MaxMind databases"
          git push